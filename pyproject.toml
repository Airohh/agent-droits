[project]
name = "agent-droits"
version = "0.1.0"
description = "Agent IA qui calcule les droits sociaux et fiscaux avec OpenFisca, cite les textes officiels, et dont la fiabilité est mesurée"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sam Pondevie" }]
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.13",
]

[project.urls]
Repository = "https://github.com/Airohh/agent-droits"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_droits"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
